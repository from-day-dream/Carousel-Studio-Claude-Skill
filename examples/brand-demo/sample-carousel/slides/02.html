<!doctype html>
<html><head><meta charset="utf-8">
<style>
{{FONT_FACES}}
{{TOKENS}}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background-color:var(--brand-paper);color:var(--brand-ink);
  background-image:linear-gradient(var(--brand-grid) 1px,transparent 1px),linear-gradient(90deg,var(--brand-grid) 1px,transparent 1px);
  background-size:var(--brand-space-grid-cell) var(--brand-space-grid-cell)}
.top{position:absolute;top:96px;left:96px;right:96px;display:flex;justify-content:space-between;
  font-family:var(--brand-font-body);font-size:var(--brand-size-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-muted)}
.main{position:absolute;left:96px;right:96px;top:324px}
.kicker{font-family:var(--brand-font-body);font-weight:600;font-size:var(--brand-size-meta);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-accent);margin:0 0 32px}
h2{margin:0;text-wrap:balance;font-family:var(--brand-font-heading);font-weight:600;font-size:var(--brand-size-headline);line-height:1;letter-spacing:-.02em}
h2 em{font-style:italic;color:var(--brand-accent)}
.key{text-wrap:pretty;margin:48px 0 0;max-width:800px;font-family:var(--brand-font-body);font-size:var(--brand-size-key);line-height:1.3}
.fix{margin:72px 0 0;padding:32px 36px;max-width:820px;background:var(--brand-ink);color:var(--brand-paper);font-family:var(--brand-font-body);font-size:var(--brand-size-support);line-height:1.4}
.fix strong{font-weight:600;color:var(--brand-accent-on-ink)}
.teaser{position:absolute;left:96px;bottom:96px;font-family:var(--brand-font-body);font-size:var(--brand-size-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-muted)}
</style></head>
<body>
<div class="slide" data-slide="2">
  <div class="top"><span data-text="meta">@quietdesk.demo</span><span data-text="meta">02 / 05</span></div>
  <div class="main">
    <p class="kicker" data-text="meta">Mistake 1</p>
    <h2 data-text="headline">Checking messages <em>first</em></h2>
    <p class="key" data-text="key">You hand your attention to other people's priorities before setting your own.</p>
    <p class="fix" data-text="support">The fix: <strong>first 60 minutes, notifications off.</strong></p>
  </div>
  <div class="teaser" data-text="meta">But silence alone isn't enough →</div>
</div>
</body></html>
